<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f5c53" />
    <title>Offline | WASSCE Study</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f6f7f2; color: #17322f; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; width: 100%; padding: 32px; border: 1px solid #d8e2dc; border-radius: 24px; background: #fff; box-shadow: 0 18px 45px rgba(15, 92, 83, .08); }
      .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; background: #0f5c53; color: #fff; font-weight: 800; letter-spacing: -.06em; }
      h1 { margin: 22px 0 8px; font-size: 28px; letter-spacing: -.04em; }
      p { line-height: 1.65; color: #5e726d; }
      a { display: inline-flex; margin-top: 12px; padding: 12px 16px; color: #fff; background: #0f5c53; border-radius: 12px; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">WS</div>
      <h1>You’re offline</h1>
      <p>Previously opened pages and saved resources may still be available. Reconnect to load anything new.</p>
      <a href="./">Try again</a>
    </main>
  </body>
</html>
